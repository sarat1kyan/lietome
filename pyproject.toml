[project]
name = "lightman"
version = "0.1.0a0"
description = "Open-source multimodal behavioral-analysis platform: observable facial, vocal, temporal and linguistic signals compared against subject-specific baselines. Not a lie detector."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Lightman contributors" }]
keywords = ["behavioral-analysis", "facial-action-units", "computer-vision", "affective-computing", "baseline-deviation"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Image Recognition",
  "Operating System :: OS Independent",
]
dependencies = [
  "numpy>=2.0",
  "av>=14.0",                      # PyAV: PTS-accurate decoding, no shell FFmpeg invocation
  "mediapipe>=1.0.0,!=1.0.1",      # Face Landmarker (Apache-2.0). 1.0.1 aborts on macOS arm64 (Metal service check), see docs/project-state.md
  "opencv-contrib-python>=4.10",   # already pulled by mediapipe; used for overlays/thumbnails
  "pydantic>=2.8",                 # validated schemas + config
  "typer>=0.12",                   # CLI
  "structlog>=24.1",               # structured logging
  "pyarrow>=17.0",                 # columnar per-frame feature storage (Parquet)
  "jinja2>=3.1",                   # HTML report templating
  "platformdirs>=4.0",             # per-OS cache dir for model weights
  "httpx>=0.27",                   # model download with size limits + streaming
]

[project.optional-dependencies]
# Future phases add opt-in extras here (audio, asr, torch...). Only declare what is used.

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.8",
  "pip-audit>=2.7",
  "types-requests",
]

[project.scripts]
lightman = "lightman.cli:app"

[project.urls]
Documentation = "docs/"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lightman"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "experiments"]

[tool.ruff.lint]
select = [
  "E", "W",      # pycodestyle
  "F",           # pyflakes
  "I",           # isort
  "UP",          # pyupgrade
  "B",           # bugbear
  "S",           # bandit (security)
  "N",           # naming
  "C4",          # comprehensions
  "SIM",         # simplify
  "PTH",         # use pathlib
  "RUF",         # ruff-specific
  "T20",         # no stray print()
  "ARG",         # unused args
  "PL",          # pylint subset
  "TRY",         # exception handling hygiene
  "PERF",
]
ignore = [
  "PLR0913",     # too many args (models/configs legitimately have many)
  "PLR2004",     # magic values in comparisons (tuned thresholds are explicit constants)
  "TRY003",      # long exception messages are fine
  "S603", "S607",# subprocess use is reviewed manually; we never use shell=True
  "PLC0415",     # lazy imports of heavy/optional deps (mediapipe, cv2) are intentional
  "PLR0912", "PLR0915", "PLR0917",  # orchestrators are long by nature; reviewed manually
  "TRY301",      # raising inside try blocks is fine when the except re-wraps
  "RUF001", "RUF002", "RUF003",  # sigma / minus signs in reports are intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "ARG", "S108"]
"src/lightman/cli.py" = ["T20"]
"experiments/**" = ["T20", "S101"]

[tool.ruff.lint.isort]
known-first-party = ["lightman"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src/lightman"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["mediapipe.*", "av.*", "cv2.*", "pyarrow.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "model: requires downloaded model weights (excluded from fast CI)",
  "slow: slow test",
  "benchmark: performance measurement, not a correctness test",
]
filterwarnings = ["error::DeprecationWarning:lightman.*"]

[tool.coverage.run]
source = ["lightman"]
branch = true
