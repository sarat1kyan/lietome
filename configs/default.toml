# Lightman configuration. Every key is optional; these are the defaults.
# Load with: lightman analyze video.mp4 --config configs/default.toml

log_level = "INFO"

[video]
# target_fps = 15.0          # time-based subsampling; omit to analyze every frame
max_faces = 1                # V0.1 analyzes the first detected face only
min_face_detection_confidence = 0.5
min_face_presence_confidence = 0.5
min_tracking_confidence = 0.5

[au]                         # FACS Action Units via OpenGraphAU (ONNX Runtime)
enabled = true
model = "opengraphau/resnet50_s2"   # or "opengraphau/resnet18_s2" (~4x faster, less confident)
stride = 1                   # run the AU model on every Nth analyzed frame
prefer_gpu = true            # use CUDAExecutionProvider when onnxruntime-gpu is installed
min_face_px = 48.0           # skip AU inference on faces narrower than this

[audio]                      # Silero VAD (ONNX) + prosodic features (librosa pyin), 16 kHz mono
enabled = true
vad_threshold = 0.5
min_speech_ms = 250
min_silence_ms = 300
f0_min_hz = 60.0
f0_max_hz = 400.0
long_pause_ms = 1500         # within-speech gap reported as a pause event
voiced_prob_min = 0.5        # only voiced speech frames feed voice baselines/events
min_event_ms = 250           # minimum voice deviation event duration
signals = ["voice.f0_hz", "voice.energy_db"]   # audio signals that get baseline-deviation events

[limits]                     # hostile-input guards, enforced before pixel memory is allocated
max_file_bytes = 4294967296  # 4 GiB
max_duration_us = 14400000000 # 4 h
max_pixels_per_frame = 8294400 # 3840x2160
max_frames = 2000000

[baseline]
mode = "leading_window"      # only mode in V0.1
window_s = 40.0              # calibration window: 12 s quiet, 14 s reading, 14 s free talk (docs/calibration.md)
min_quality = 0.5            # frames below this quality are excluded from the baseline
min_samples = 60             # fewer usable frames -> "unreliable" note
good_samples = 600           # sample-size term saturates here

[events]
z_enter = 3.0                # |robust z| to open a deviation event
z_exit = 2.0                 # hysteresis close threshold
min_duration_ms = 120
merge_gap_ms = 200
min_frame_quality = 0.4
warmup_ms = 300              # trackers need a few frames to settle; events before this are dropped
blink_ear_threshold = 0.21   # absolute fallback; relative (70% of baseline EAR) is used when available
blink_min_ms = 50
blink_max_ms = 500
signals = [
  "head.yaw_deg", "head.pitch_deg", "head.roll_deg",
  "eye.aspect_ratio_mean",
  "blendshape.browDownLeft", "blendshape.browDownRight", "blendshape.browInnerUp",
  "blendshape.mouthPressLeft", "blendshape.mouthPressRight", "blendshape.jawOpen",
  "blendshape.eyeSquintLeft", "blendshape.eyeSquintRight",
  "au.AU1", "au.AU2", "au.AU4", "au.AU5", "au.AU6", "au.AU7", "au.AU9", "au.AU10", "au.AU12",
  "au.AU14", "au.AU15", "au.AU17", "au.AU20", "au.AU23", "au.AU24", "au.AU25", "au.AU26",
]

[events.z_enter_by_prefix]   # noisier classifier outputs need a higher bar; exit shifts by the same amount
"au." = 4.0
"blendshape." = 4.0

[storage]
store_landmarks = false      # 478x3 per frame is large and biometric; off by default
write_report = true
event_thumbnails = true
thumbnail_max_px = 256

[privacy]
anonymous_subject_ids = true
retain_media_copy = false    # Lightman never copies the input media
persist_source_path = false  # only the file name and SHA-256 are stored

[models]
# cache_dir = "/path/to/models"   # or set LIGHTMAN_MODEL_DIR
allow_download = true        # set false for air-gapped use; import with `lightman models import`
