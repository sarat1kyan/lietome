name: release

# Push a version tag (v0.2.0) to build the web UI, the wheel and the source archive, publish a
# GitHub release with them, and push the Docker image to GitHub Container Registry.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build web UI
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run build
      - uses: astral-sh/setup-uv@v6
      - name: Check tag matches the package version
        run: |
          v=$(grep -m1 '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} does not match version $v"; exit 1; }
      - name: Build wheel and sdist
        run: uv build
      - name: Check the wheel contains the UI
        run: python3 -c "import zipfile,glob,sys; n=zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); sys.exit(0 if any('api/static/index.html' in x for x in n) else 1)"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk -v h="## [${GITHUB_REF_NAME#v}]" 'index($0,h)==1{f=1;next} /^## \[/{f=0} f' CHANGELOG.md)
          gh release create "${GITHUB_REF_NAME}" dist/* --title "Lightman ${GITHUB_REF_NAME}" --notes "${notes:-See CHANGELOG.md}"

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/lightman:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/lightman:latest
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
