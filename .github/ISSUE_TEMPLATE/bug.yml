name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach recordings, transcripts or reports of real people. Security problems go to private vulnerability reporting, not here.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `lightman version`
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Environment
      description: Output of `lightman doctor`
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Terminal output around the error
      render: text
